name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install the app tools
        run: npm install

      - name: Create the Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Allow more time to download Gradle (the default 10 seconds is too short)
        run: |
          f=android/gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' "$f"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=300000/' "$f"
          else
            echo 'networkTimeout=300000' >> "$f"
          fi
          cat "$f"

      - name: Copy the web files into the Android project
        run: npx cap sync android

      - name: Build the APK (tries up to 3 times in case a download fails)
        working-directory: android
        run: |
          chmod +x gradlew
          n=0
          until ./gradlew assembleDebug --stacktrace; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "Build failed 3 times"; exit 1; fi
            echo "Build failed, trying again in 20 seconds (attempt $((n+1)) of 3)"
            sleep 20
          done

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: Drawable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
