# Save as: .github/workflows/build.yml  (in the Drawable-Mobile repo)
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (caches the download)
        uses: gradle/actions/setup-gradle@v4

      - name: Give the Gradle download more time
        run: |
          chmod +x gradlew
          sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties

      - name: Download Gradle with retries
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed, retrying in 20 seconds..."
            sleep 20
          done
          exit 1

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drawable-Mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
